<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>F-Engineering Launcher v3</title>
  <link rel="stylesheet" href="styles.css?v=20260812-21">
</head>
<body>
  <main class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="action-grid" aria-label="Действия с объектом">
        <button id="loadObject" type="button" title="Добавить новый объект в Launcher. Исходная папка не переносится и не меняется.">Загрузить</button>
        <button id="refreshObject" type="button" disabled title="Проверить выбранный объект заново и обновить его манифест. Позже здесь будет обновление только изменений.">Обновить</button>
        <button id="displayObject" type="button" disabled title="Открыть выбранный объект: показать дерево, поиск и фильтры файлов.">Отобразить</button>
        <button id="excludeObject" type="button" disabled title="Убрать объект из списка Launcher. Исходная папка не удаляется.">Исключить</button>
      </div>
      <div class="progress-panel" id="progressPanel" hidden>
        <div class="progress-head"><span id="progressLabel">Операция…</span><strong id="progressValue">0%</strong></div>
        <div class="progress-track"><span id="progressFill"></span></div>
        <div class="progress-detail" id="progressDetail">Подготовка</div>
        <button class="cancel-button" id="cancelOperation" type="button">Отменить</button>
      </div>

      <section class="state active" id="objectListState">
        <div class="section-title">Объекты</div>
        <div class="object-list" id="objectList"></div>
        <div class="stats" id="objectStats">Объект не выбран</div>
      </section>

      <section class="state" id="treeState">
        <div class="tree-nav">
          <button class="back-button" id="backToObjects" type="button" title="Вернуться к списку загруженных объектов">К объектам</button>
          <button class="back-button" id="backToTree" type="button" disabled title="Вернуться к предыдущему состоянию дерева">Назад</button>
        </div>
        <input class="search-input" id="treeSearch" type="search" placeholder="Поиск: pdf, разрез, спецификация…" spellcheck="false">
        <div class="format-strip" id="formatStrip"></div>
        <div class="selection-summary" id="selectionSummary">Выделение пустое</div>
        <div class="tree" id="objectTree"></div>
      </section>
    </aside>

    <section class="viewer" aria-label="Область просмотра PDF">
      <div class="pdf-viewer empty" id="pdfViewer">
        <div class="pdf-thumbs" id="pdfThumbs"></div>
        <div class="pdf-stage" id="pdfStage">
          <div class="viewer-empty" id="viewerEmpty"></div>
          <div class="quality-badge" id="qualityBadge" hidden>Обзор 150 DPI</div>
          <img id="pdfPageImage" alt="" hidden>
          <div class="viewer-controls" id="viewerControls" hidden>
            <button id="viewZoomOut" type="button" title="Уменьшить">−</button>
            <button id="viewZoomIn" type="button" title="Увеличить">+</button>
            <button id="viewFit" type="button" title="Вписать страницу">Вписать</button>
            <button id="viewRotate" type="button" title="Повернуть на 90°">⟳</button>
            <button id="viewPanMode" type="button" title="Рука / стрелка" aria-label="Рука / стрелка">
              <svg class="hand-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M8.2 11.2V5.7a1.25 1.25 0 0 1 2.5 0v5.1" />
                <path d="M10.7 10.6V4.8a1.25 1.25 0 0 1 2.5 0v5.8" />
                <path d="M13.2 10.8V6.1a1.25 1.25 0 0 1 2.5 0v5.5" />
                <path d="M15.7 12V8.2a1.2 1.2 0 0 1 2.4 0v6.1c0 4-2.5 6.7-6.3 6.7h-.9c-2.2 0-3.7-.9-5-2.8L3.6 15a1.35 1.35 0 0 1 2.1-1.7l2.1 2.1" />
              </svg>
            </button>
            <button id="openNativeFile" type="button" hidden title="Открыть исходный файл в программе Windows по умолчанию">Открыть DWG</button>
            <button id="viewStandardMode" type="button" title="Стандартный режим: левая панель, миниатюры и просмотр">▦</button>
            <button id="viewMediumMode" type="button" title="Средний режим: скрыть левую панель, оставить миниатюры">▤</button>
            <button id="viewFullMode" type="button" title="Полный просмотр: скрыть левую панель и миниатюры">▢</button>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script src="app.js?v=20260812-21"></script>
</body>
</html>
