<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>F-Engineering Launcher v3</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="action-grid" aria-label="Действия с объектом">
        <button id="loadObject" type="button" title="Добавить новый объект в Launcher. Исходная папка не переносится и не меняется.">Загрузить</button>
        <button id="refreshObject" type="button" disabled title="Проверить выбранный объект заново и обновить его манифест. Позже здесь будет обновление только изменений.">Обновить</button>
        <button id="displayObject" type="button" disabled title="Открыть выбранный объект: показать дерево, поиск и фильтры файлов.">Отобразить</button>
        <button id="excludeObject" type="button" disabled title="Убрать объект из списка Launcher. Исходная папка не удаляется.">Исключить</button>
      </div>

      <div class="progress-panel" id="progressPanel" hidden>
        <div class="progress-head"><span id="progressLabel">Операция…</span><strong id="progressValue">0%</strong></div>
        <div class="progress-track"><span id="progressFill"></span></div>
        <div class="progress-detail" id="progressDetail">Подготовка</div>
        <button class="cancel-button" id="cancelOperation" type="button">Отменить</button>
      </div>

      <section class="state active" id="objectListState">
        <label class="path-label" for="objectPath">Путь для загрузки, если диалог Windows недоступен</label>
        <textarea id="objectPath" rows="2" spellcheck="false" placeholder="C:\Users\a9379\Documents\Legenda_Leningradskoe"></textarea>
        <div class="section-title">Объекты</div>
        <div class="object-list" id="objectList"></div>
        <div class="stats" id="objectStats">Объект не выбран</div>
      </section>

      <section class="state" id="treeState">
        <button class="back-button" id="backToObjects" type="button" title="Вернуться к списку загруженных объектов">← К объектам</button>
        <input class="search-input" id="treeSearch" type="search" placeholder="Поиск: pdf, разрез, спецификация…" spellcheck="false">
        <div class="format-strip" id="formatStrip"></div>
        <div class="selection-summary" id="selectionSummary">Выделение пустое</div>
        <div class="tree" id="objectTree"></div>
      </section>
    </aside>

    <section class="viewer" aria-label="Правая область пока оставлена пустой">
      <div class="viewer-empty"></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
